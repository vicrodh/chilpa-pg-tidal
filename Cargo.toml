[package]
name = "chilpa-pg-tidal"
description = "Tidal for Chilpa, as a native process plugin"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.90"
publish = false

[[bin]]
name = "plugin"
path = "src/main.rs"

[lib]
name = "tidal_plugin"
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.23"
sha2 = "0.10"
rand = "0.9"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
roxmltree = "0.21"
symphonia-core = "0.5.5"
symphonia-bundle-flac = "0.5.5"

[features]
# Sends every request to CHILPA_TIDAL_MOCK, for the differential tests. Never packaged.
mock-endpoints = []

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
